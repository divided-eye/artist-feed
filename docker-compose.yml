name: artist-feed   # fixed name, so an update replaces the running app whatever the folder is called
services:
  artist-feed:
    build: .
    restart: always
    ports:
      - "8080:8000"          # use "127.0.0.1:8080:8000" to keep it to this machine only
    volumes:
      - ./data:/data         # the artist list and feed history live here
    environment:
      REFRESH_MINUTES: "60"  # how often to check for new posts
      # LOOKUP_FALLBACK: "bandcamp"   # artist link when a track isn't found; default is their SoundCloud profile (also settable in the Link Finder panel)
      BANDCAMP_FAN: ""   # your Bandcamp username; Link Finder checks its purchases first (can also be set in the Link Finder panel)
      # CATCH_UP_MINUTES: "10"   # how often pages with older releases still to load are visited between refreshes
      # LOOKUP_SEARCH_DAYS: "7"   # how long Bandcamp's search answers are reused by Link Finder
      # SOUNDCLOUD_USER: ""   # your SoundCloud username; profiles it follows are preferred (can also be set in Settings)
      # SOUNDCLOUD_CLIENT_ID: ""   # optional; found automatically when unset
